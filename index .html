const G=[['Terlambat','alert-triangle',t=>dd(t.deadline)<0],['Hari ini','sun',t=>dd(t.deadline)===0],['Besok','sunrise',t=>dd(t.deadline)===1],['Minggu ini','calendar-range',t=>{const d=dd(t.deadline);return d>=2&&d<=7}]];
return`<div class="g stats">${cd.map(x=>`<div class="c st"><span class="ico ${x[3]}">${ic(x[2])}</span><b>${x[1]}</b><span>${x[0]}</span></div>`).join('')}</div>
<div class="g two"><div class="c"><h2>${ic('target')}Progress keseluruhan</h2><div style="display:flex;justify-content:space-between;margin-bottom:8px"><b style="font-size:30px">${s.pct}%</b><span style="color:var(--mut);align-self:end">${s.d} dari ${s.tot} SKL selesai</span></div><div class="pb"><i style="width:${s.pct}%"></i></div></div>
<div class="c"><h2>${ic('bar-chart-3')}Perkembangan 6 minggu terakhir</h2>${bars(weekly(6))}</div></div>
<h2 style="margin-top:6px">${ic('flag')}Daftar prioritas</h2><div class="g two">${G.map(g=>{const l=U.filter(g[2]);return`<div class="c"><h2>${ic(g[1])}${g[0]} <span class="b ${l.length&&g[0]==='Terlambat'?'re':'gy'}">${l.length}</span></h2><div class="lst">${l.length?l.map(t=>row(t,1)).join(''):empty('Tidak ada SKL','party-popper')}</div></div>`}).join('')}</div>`}
function filt(){const q=V.q.toLowerCase();const a=S.tasks.filter(t=>{const d=dd(t.deadline);return(!q||t.name.toLowerCase().includes(q))&&(!V.fc||t.cat===V.fc)&&(!V.fs||(V.fs==='Overdue'?over(t):t.status===V.fs))&&(!V.fp||t.prio===V.fp)&&(!V.fd||(V.fd==='today'&&d===0)||(V.fd==='week'&&d>=0&&d<=7)||(V.fd==='month'&&d>=0&&d<=30)||(V.fd==='late'&&d<0))});
a.sort((x,y)=>V.sort==='desc'?y.deadline.localeCompare(x.deadline):V.sort==='prio'?PR.indexOf(y.prio)-PR.indexOf(x.prio):x.deadline.localeCompare(y.deadline));return a}
const lb=()=>{const a=filt();return a.length?`<div class="lst ${V.view==='grid'?'grid':''}">${a.map(t=>row(t)).join('')}</div>`:empty('Tidak ada SKL yang cocok dengan filter.','search-x')};
function list(){return`<div class="bar"><input class="in" id="q" placeholder="Cari nama SKL…" value="${esc(V.q)}"><button class="btn" data-a="new">${ic('plus')}Tambah SKL</button></div>
<div class="bar"><select class="sl" data-f="fc"><option value="">Semua kategori</option>${opts(CATS,V.fc)}</select><select class="sl" data-f="fs"><option value="">Semua status</option>${opts([...ST,'Overdue'],V.fs)}</select><select class="sl" data-f="fp"><option value="">Semua prioritas</option>${opts(PR,V.fp)}</select><select class="sl" data-f="fd">${opts([['','Semua deadline'],['today','Hari ini'],['week','7 hari ke depan'],['month','30 hari ke depan'],['late','Terlambat']],V.fd)}</select><select class="sl" data-f="sort">${opts([['asc','Deadline terdekat'],['desc','Deadline terjauh'],['prio','Prioritas tertinggi']],V.sort)}</select>
<button class="ib" data-a="view" data-id="list" title="Tampilan list" style="${V.view==='list'?'border-color:var(--ac)':''}">${ic('list')}</button><button class="ib" data-a="view" data-id="grid" title="Tampilan grid" style="${V.view==='grid'?'border-color:var(--ac)':''}">${ic('layout-grid')}</button></div><div id="lb">${lb()}</div>`}
function calendar(){const f=new Date(V.y,V.m,1),off=(f.getDay()+6)%7,n=new Date(V.y,V.m+1,0).getDate(),by={};S.tasks.forEach(t=>(by[t.deadline]=by[t.deadline]||[]).push(t));
let cells='';for(let i=0;i<off;i++)cells+='<div class="dy e"></div>';for(let d=1;d<=n;d++){const k=V.y+'-'+pad(V.m+1)+'-'+pad(d),l=by[k]||[];cells+=`<button class="dy ${k===today()?'t':''} ${k===V.sel?'s':''}" data-a="day" data-id="${k}">${d}<span class="dts">${l.slice(0,3).map(t=>`<i style="background:${t.status==='Selesai'?'#22c55e':over(t)?'#ef4444':'#2f6df6'}"></i>`).join('')}</span></button>`}
const sl=(by[V.sel]||[]);return`<div class="g two" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr))"><div class="c"><div class="bar" style="margin-bottom:10px"><button class="ib" data-a="mo" data-id="-1">${ic('chevron-left')}</button><h2 style="flex:1;justify-content:center;margin:0;text-transform:capitalize">${f.toLocaleDateString('id-ID',{month:'long',year:'numeric'})}</h2><button class="ib" data-a="mo" data-id="1">${ic('chevron-right')}</button><button class="btn o" data-a="mo" data-id="0">Hari ini</button></div>
<div class="cal">${['Sen','Sel','Rab','Kam','Jum','Sab','Min'].map(x=>`<small>${x}</small>`).join('')}${cells}</div><p style="margin-top:12px;font-size:12px;color:var(--mut)"><span style="color:#2f6df6">●</span> Belum selesai &nbsp;<span style="color:#ef4444">●</span> Terlambat &nbsp;<span style="color:#22c55e">●</span> Selesai</p></div>
<div class="c"><h2>${ic('calendar-check')}${fmt(V.sel)}</h2><div class="lst">${sl.length?sl.map(t=>row(t)).join(''):empty('Tidak ada deadline pada tanggal ini','calendar-off')}</div></div></div>`}
function progress(){const s=stats(),D=S.tasks.filter(t=>t.doneAt).sort((a,b)=>b.doneAt.localeCompare(a.doneAt)),w=weekly(6),l7=S.tasks.filter(t=>t.doneAt&&t.doneAt>=add(-6)).length,on=D.filter(t=>t.doneAt<=t.deadline).length;
const k=[['Progress',s.pct+'%'],['Belum selesai',s.u],['Selesai 7 hari terakhir',l7],['Rata-rata / minggu',(w.reduce((a,x)=>a+x.v,0)/6).toFixed(1)],['Tepat waktu',D.length?Math.round(on/D.length*100)+'%':'–']];
return`<div class="g stats">${k.map(x=>`<div class="c st"><b>${x[1]}</b><span>${x[0]}</span></div>`).join('')}</div><div class="g two"><div class="c"><h2>${ic('bar-chart-3')}SKL selesai per minggu</h2>${bars(weekly(8))}</div><div class="c"><h2>${ic('history')}Riwayat selesai</h2><div class="lst">${D.length?D.map(t=>`<div class="r dn"><button class="ck on" data-a="tog" data-id="${t.id}" title="Batalkan selesai">${ic('check')}</button><div class="rt"><b>${esc(t.name)}</b><small>Selesai ${fmt(t.doneAt)}</small></div></div>`).join(''):empty('Belum ada SKL selesai')}</div></div></div>`}
const sw=(on,a,id)=>`<button class="sw ${on?'on':''}" data-a="${a}" data-id="${id||''}" role="switch" aria-checked="${on}"></button>`;
function prefs(){const sup='Notification' in window;return`<div class="fr"><div>Aktifkan pengingat<small>Pengingat dalam website dan badge lonceng.</small></div>${sw(S.remind,'tr')}</div><div class="fr"><div>Waktu pengingat<small>Muncul pada hari ke-N sebelum deadline.</small></div><div style="display:flex;gap:10px;flex-wrap:wrap">${[7,3,1,0].map(d=>`<label><input type="checkbox" data-d="${d}" ${S.days.includes(d)?'checked':''}> ${d?'H-'+d:'Hari H'}</label>`).join('')}</div></div><div class="fr"><div>Notifikasi browser<small>${sup?'Izin: '+Notification.permission+'. Hanya muncul saat website ini terbuka di tab browser (belum memakai Push/service worker).':'Browser tidak mendukung.'}</small></div>${sw(S.notif,'tn')}</div>`}
function reminders(){const r=rem();return`<div class="g two"><div class="c"><h2>${ic('bell-ring')}Pengingat aktif <span class="b ${r.length?'re':'gy'}">${r.length}</span></h2><div class="lst">${r.length?r.map(t=>row(t,1)).join(''):empty('Tidak ada pengingat saat ini','bell-off')}</div></div><div class="c"><h2>${ic('sliders-horizontal')}Preferensi</h2>${prefs()}<p style="color:var(--mut);font-size:12.5px;margin-top:12px">Mau diingatkan di HP saat browser tertutup? Tekan ikon kalender pada SKL (di halaman Semua SKL) untuk menambahkannya ke Google Calendar.</p></div></div>`}
function settings(){return`<div class="g two"><div class="c"><h2>${ic('user')}Profil &amp; tampilan</h2><div class="fr"><div>Nama pengguna</div><input class="in" data-f="name" value="${esc(S.name)}" maxlength="30"></div><div class="fr"><div>Tema</div><div style="display:flex;gap:6px"><button class="btn ${S.theme==='light'?'':'o'}" data-a="th" data-id="light">${ic('sun')}Light</button><button class="btn ${S.theme==='dark'?'':'o'}" data-a="th" data-id="dark">${ic('moon')}Dark</button></div></div></div>
<div class="c"><h2>${ic('bell')}Notifikasi &amp; reminder</h2>${prefs()}</div>
<div class="c"><h2>${ic('database')}Data</h2><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn o" data-a="exp" data-id="json">${ic('file-json')}Export JSON</button><button class="btn o" data-a="exp" data-id="csv">${ic('file-spreadsheet')}Export CSV</button><button class="btn o" data-a="exp" data-id="ics">${ic('calendar-plus')}Kalender (.ics)</button><button class="btn o" data-a="imp">${ic('upload')}Import JSON</button></div></div>
<div class="c"><h2 style="color:#ef4444">${ic('alert-octagon')}Zona bahaya</h2><p style="color:var(--mut);margin-bottom:12px">Menghapus semua SKL dari perangkat ini.</p><button class="btn d" data-a="askall">${ic('trash-2')}Hapus semua data</button></div></div>`}
function panel(){const r=rem().slice(0,6);return`<div class="c pn"><h2>${ic('bell')}Pengingat</h2><div class="lst">${r.length?r.map(t=>row(t,1)).join(''):empty('Tidak ada pengingat')}</div><button class="btn o" style="margin-top:10px;width:100%;justify-content:center" data-a="go" data-id="reminders">Lihat semua</button></div>`}
function csv(){const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';return['nama,deskripsi,kategori,ditambahkan,deadline,prioritas,status,catatan'].concat(S.tasks.map(t=>[t.name,t.desc,t.cat,t.added,t.deadline,t.prio,t.status,t.notes].map(q).join(','))).join('\n')}
function ics(){const z=s=>s.replace(/-/g,''),q=s=>String(s||'').replace(/[\\;,]/g,'\\$&').replace(/\n/g,'\\n'),nx=s=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+1);return z(iso(d))},AL=['-P6DT15H','-P2DT15H','-PT15H','PT9H'];
const ev=t=>['BEGIN:VEVENT','UID:'+t.id+'@skl-manager','DTSTAMP:'+z(today())+'T000000Z','DTSTART;VALUE=DATE:'+z(t.deadline),'DTEND;VALUE=DATE:'+nx(t.deadline),'SUMMARY:'+q('Deadline: '+t.name),'DESCRIPTION:'+q(t.desc)].concat([].concat(...AL.map(g=>['BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+q(t.name),'TRIGGER:'+g,'END:VALARM'])),['END:VEVENT']);
return['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//SKL Manager//ID'].concat([].concat(...S.tasks.filter(t=>t.status!=='Selesai').map(ev)),['END:VCALENDAR']).join('\r\n')}
function modal(){const m=V.modal;let h='';
if(m.t==='form'){const t=m.task||{},nw=!m.task;h=`<form class="c md" id="f"><h2>${ic(nw?'plus-circle':'pencil')}${nw?'Tambah SKL':'Edit SKL'}</h2><div class="fm"><label class="w">Nama SKL<input class="in" name="name" required maxlength="80" value="${esc(t.name)}"></label><label>Kategori<select class="in" name="cat">${opts(CATS,t.cat||CATS[0])}</select></label><label>Deadline<input class="in" type="date" name="deadline" required value="${t.deadline||add(7)}"></label><label>Prioritas<select class="in" name="prio">${opts(PR,t.prio||'Medium')}</select></label><label>Status<select class="in" name="status">${opts(ST,t.status||ST[0])}</select></label><label class="w">Deskripsi<textarea name="desc">${esc(t.desc)}</textarea></label><label class="w">Catatan tambahan<textarea name="notes">${esc(t.notes)}</textarea></label><label class="w" style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" name="remind" ${t.remind!==false?'checked':''}> Ingatkan saya untuk SKL ini</label>${nw?'':`<small class="w" style="color:var(--mut)">Ditambahkan: ${fmt(t.added)}</small>`}</div><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px"><button type="button" class="btn o" data-a="x">Batal</button><button class="btn">${ic('save')}Simpan</button></div></form>`}
else if(m.t==='confirm')h=`<div class="c md"><h2>${ic('alert-triangle')}Konfirmasi</h2><p style="margin-bottom:16px">${esc(m.msg)}</p><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn o" data-a="x">Batal</button><button class="btn d" data-a="${m.act}" data-id="${m.id||''}">Ya, hapus</button></div></div>`;
else if(m.t==='exp')h=`<div class="c md"><h2>${ic('download')}Export ${m.k.toUpperCase()}</h2><textarea id="ta" readonly style="min-height:220px">${esc(m.k==='json'?JSON.stringify({user:S.name,tasks:S.tasks},null,2):m.k==='ics'?ics():csv())}</textarea><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px"><button class="btn o" data-a="x">Tutup</button><button class="btn o" data-a="copy">${ic('copy')}Salin</button><button class="btn" data-a="dl" data-id="${m.k}">${ic('download')}Unduh</button></div></div>`;
else h=`<div class="c md"><h2>${ic('upload')}Import JSON</h2><p style="color:var(--mut);margin-bottom:8px">Pilih file atau tempel JSON. SKL akan ditambahkan ke data yang ada.</p><input type="file" id="fi" accept=".json,application/json" style="margin-bottom:8px"><textarea id="ta" style="min-height:180px" placeholder='{"tasks":[…]}'></textarea><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px"><button class="btn o" data-a="x">Batal</button><button class="btn" data-a="doimp">Import</button></div></div>`;
return`<div class="mo" data-a="close">${h}</div>`}
function shell(c){const N=[['dashboard','layout-dashboard','Dashboard'],['list','list-checks','Semua SKL'],['new','plus-circle','Tambah SKL'],['calendar','calendar-days','Kalender'],['progress','trending-up','Progress'],['reminders','bell-ring','Pengingat'],['settings','settings','Pengaturan']],n=rem().length;
return`<aside class="side ${V.nav?'open':''}"><div class="logo">${ic('graduation-cap')}SKL Manager</div>${N.map(([k,i,l])=>`<button class="nv ${V.page===k?'on':''}" data-a="${k==='new'?'new':'go'}" data-id="${k}">${ic(i)}${l}${k==='reminders'&&n?`<em class="dot">${n}</em>`:''}</button>`).join('')}<p class="sn">Data tersimpan di browser ini.</p></aside><div class="ov ${V.nav?'show':''}" data-a="nav"></div>
<main><header class="hd"><button class="ib burger" data-a="nav" aria-label="Menu">${ic('menu')}</button><div><h1>Halo, ${esc(S.name)}</h1><small>${new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</small></div><div class="sp"></div><button class="ib" data-a="theme" aria-label="Tema">${ic(S.theme==='dark'?'sun':'moon')}</button><button class="ib" data-a="bell" aria-label="Pengingat">${ic('bell')}${n?`<em class="dot">${n}</em>`:''}</button>${V.panel?panel():''}</header>${c}</main>${V.modal?modal():''}`}
function render(){document.documentElement.dataset.theme=S.theme;$('#app').innerHTML=shell({dashboard:dash,list,calendar,progress,reminders,settings}[V.page]())}
function ask(){if(S.notif&&'Notification' in window&&Notification.permission==='default')Notification.requestPermission().then(()=>{render();notify()})}
let SW=null;
function showN(t,b){try{if(SW&&SW.showNotification)SW.showNotification(t,{body:b,icon:'icons/icon.svg',tag:b});else new Notification(t,{body:b})}catch(e){}}
function notify(){if(!S.notif||!('Notification' in window)||Notification.permission!=='granted')return;let c=0;rem().forEach(t=>{const k=t.id+':'+today();if(!S.shown[k]){S.shown[k]=1;c=1;showN('SKL Manager',t.name+' — '+left(t))}});if(c)save()}
function act(a,id,e,b){const t=S.tasks.find(x=>x.id===id);
switch(a){case'go':V.page=id;V.nav=V.panel=false;try{location.hash=id}catch(_){}break;case'nav':V.nav=!V.nav;break;case'bell':V.panel=!V.panel;break;case'theme':S.theme=S.theme==='dark'?'light':'dark';break;case'th':S.theme=id;break;
case'new':V.modal={t:'form'};V.panel=V.nav=false;break;case'edit':if(t)V.modal={t:'form',task:t};V.panel=false;break;case'close':if(e.target!==b)return;V.modal=null;break;case'x':V.modal=null;break;
case'tog':setSt(t,t.status==='Selesai'?'Belum Dikerjakan':'Selesai');toast(t.status==='Selesai'?'SKL ditandai selesai 🎉':'Status dikembalikan');break;
case'del':V.modal={t:'confirm',msg:`Hapus "${t.name}"?`,act:'delone',id};break;case'delone':S.tasks=S.tasks.filter(x=>x.id!==id);V.modal=null;toast('SKL dihapus');break;
case'askall':V.modal={t:'confirm',msg:'Hapus SEMUA data SKL? Tindakan ini tidak dapat dibatalkan.',act:'delall'};break;case'delall':S.tasks=[];S.shown={};V.modal=null;toast('Semua data dihapus');break;
case'view':V.view=id;break;case'day':V.sel=id;break;case'mo':{if(id==='0'){const d=new Date();V.y=d.getFullYear();V.m=d.getMonth();V.sel=today()}else{const d=new Date(V.y,V.m+ +id,1);V.y=d.getFullYear();V.m=d.getMonth()}break}
case'tr':S.remind=!S.remind;break;case'tn':S.notif=!S.notif;if(S.notif){if(!('Notification' in window))toast('Browser tidak mendukung notifikasi');else ask()}break;
case'exp':V.modal={t:'exp',k:id};break;case'imp':V.modal={t:'imp'};break;
case'copy':{const v=$('#ta').value;(navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(()=>toast('Tersalin'),()=>{$('#ta').select();toast('Salin manual dari kotak teks')});return}
case'dl':{try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([$('#ta').value],{type:'text/plain'}));a.download='skl-manager.'+id;document.body.appendChild(a);a.click();a.remove();toast('Mengunduh… jika gagal, gunakan Salin')}catch(_){toast('Gunakan tombol Salin')}return}
case'doimp':{try{let j=JSON.parse($('#ta').value);j=Array.isArray(j)?j:j.tasks;if(!Array.isArray(j))throw 0;let n=0;j.forEach(x=>{if(x&&x.name&&/^\d{4}-\d{2}-\d{2}$/.test(x.deadline)){const s=ST.includes(x.status)?x.status:ST[0],o={id:uid(),name:String(x.name),desc:String(x.desc||''),cat:x.cat||'Lainnya',added:x.added||today(),deadline:x.deadline,prio:PR.includes(x.prio)?x.prio:'Medium',status:s,notes:String(x.notes||''),remind:x.remind!==false};setSt(o,s);if(s==='Selesai'&&x.doneAt)o.doneAt=x.doneAt;S.tasks.push(o);n++}});V.modal=null;toast(n+' SKL diimpor')}catch(_){toast('JSON tidak valid');return}break}}
save();render()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)act(b.dataset.a,b.dataset.id,e,b)});
document.addEventListener('change',e=>{const x=e.target;if(x.dataset.st){const t=S.tasks.find(k=>k.id===x.dataset.st);setSt(t,x.value);save();render()}
else if(x.dataset.f){if(x.dataset.f==='name'){S.name=x.value.trim()||'Siswa';toast('Nama disimpan')}else V[x.dataset.f]=x.value;save();render()}
else if(x.dataset.d!==undefined){const d=+x.dataset.d;S.days=x.checked?[...new Set([...S.days,d])]:S.days.filter(k=>k!==d);save();render()}
else if(x.id==='fi'&&x.files[0]){const r=new FileReader();r.onload=()=>{$('#ta').value=r.result};r.readAsText(x.files[0])}});
document.addEventListener('input',e=>{if(e.target.id==='q'){V.q=e.target.value;$('#lb').innerHTML=lb()}});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id!=='f')return;const f=new FormData(e.target),o={name:f.get('name').trim(),cat:f.get('cat'),desc:f.get('desc'),deadline:f.get('deadline'),prio:f.get('prio'),notes:f.get('notes'),remind:!!f.get('remind')},s=f.get('status'),ex=V.modal.task;
if(ex){Object.assign(ex,o);setSt(ex,s)}else{const t=Object.assign({id:uid(),added:today()},o);setSt(t,s);S.tasks.push(t)}V.modal=null;toast(ex?'SKL diperbarui':'SKL ditambahkan');save();render()});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(PAGES.includes(h)&&h!==V.page){V.page=h;render()}});
{const h=location.hash.slice(1);if(PAGES.includes(h))V.page=h}
let last=today();setInterval(()=>{if(today()!==last){last=today();render()}notify()},60000);
render();save();notify();{const n=rem().length;if(n)setTimeout(()=>toast(`${n} SKL perlu perhatian`),600)}
if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').then(r=>{SW=r}).catch(()=>{});

</script>
</body></html>
